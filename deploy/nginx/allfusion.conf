# AllFusion 生产模式 nginx 配置示例（独立配置文件，不改系统默认 nginx.conf）
# 启动：nginx.exe -p <nginx 安装目录> -c "<本文件绝对路径>"
# 停止：nginx.exe -p <nginx 安装目录> -s stop
# 说明：默认只监听 127.0.0.1:8080；远程访问建议经内网隧道（如 Tailscale serve 等）
#       转发到本端口，不要把 8080 直接暴露到公网。若需局域网直连，自行改 listen 并做好防火墙。

worker_processes 1;
events { worker_connections 1024; }

http {
    include       mime.types;
    default_type  application/octet-stream;

    sendfile        on;
    keepalive_timeout 65;
    server_tokens   off;
    client_max_body_size 200m;

    log_format af '$remote_addr [$time_local] "$request" $status '
                  '$body_bytes_sent rt=$request_time "$http_referer" "$http_user_agent"';
    access_log logs/allfusion_access.log af;
    error_log  logs/allfusion_error.log warn;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml text/xml image/svg+xml;

    # 限流：普通接口 30 次/分，登录/注册 10 次/分（防撞库）；试点规模，后续按用户级再调
    limit_req_zone $binary_remote_addr zone=af_api:10m    rate=30r/m;
    limit_req_zone $binary_remote_addr zone=af_login:10m  rate=10r/m;
    limit_req_status 429;

    upstream af_auth { server 127.0.0.1:8004; keepalive 16; }
    upstream af_ua   { server 127.0.0.1:8000; keepalive 16; }
    upstream af_kb   { server 127.0.0.1:8003; keepalive 16; }

    server {
        # 本机回环：start_all 探活 + 未来 tailscale serve 的转发目标
        listen      127.0.0.1:8080;
        server_name _;

        # 前端生产构建产物（npm run build 生成）
        # TODO 改成实际的 dist 绝对路径（Windows 下用正斜杠）
        root  /path/to/AllFusion/cherry-ui/dist;
        index index.html;

        # 带 hash 的静态资源长缓存；index.html 不缓存，避免发版后拿到旧壳
        location /assets/ {
            expires 30d;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }

        # ---- auth_service:8004（/api/auth → /auth）----
        location /api/auth {
            limit_req zone=af_login burst=10 nodelay;
            rewrite ^/api/auth(.*)$ /auth$1 break;
            proxy_pass http://af_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # ---- auth_service 的其余 API（去掉 /api 前缀）----
        location ~ ^/api/(providers|routes|model-pref|datasources|admin)(.*)$ {
            limit_req zone=af_api burst=30 nodelay;
            rewrite ^/api/(providers|routes|model-pref|datasources|admin)(.*)$ /$1$2 break;
            proxy_pass http://af_auth;
            proxy_http_version 1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    120s;
            proxy_read_timeout    120s;
        }

        # ---- unified_agent:8000（/api/ua → 去掉前缀；问数可能跑 600s，必须放宽读超时）----
        location /api/ua {
            limit_req zone=af_api burst=30 nodelay;
            rewrite ^/api/ua(.*)$ $1 break;
            proxy_pass http://af_ua;
            proxy_http_version 1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    900s;
            proxy_read_timeout    900s;
            proxy_buffering       off;      # 流式输出（SSE）
            proxy_cache           off;
        }

        # ---- kb_service:8003（/api/kb → 去掉前缀；文档上传走大 body）----
        location /api/kb {
            limit_req zone=af_api burst=30 nodelay;
            rewrite ^/api/kb(.*)$ $1 break;
            proxy_pass http://af_kb;
            proxy_http_version 1.1;
            proxy_set_header Connection          "";
            proxy_set_header Host                $host;
            proxy_set_header X-Real-IP           $remote_addr;
            proxy_set_header X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto   $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    300s;
            proxy_read_timeout    300s;
        }
    }
}
