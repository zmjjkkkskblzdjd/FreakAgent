[project]
name = "doc-parser"
version = "0.1.0"
description = "docling-based document parsing microservice: raw bytes -> Markdown"
requires-python = ">=3.10"
dependencies = [
    "docling>=2.0.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.7.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
