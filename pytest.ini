[pytest]
# 精确过滤：只屏蔽「字段名 schema 遮蔽 BaseModel.schema()」这一类 Pydantic 警告，
# 不放行其它 UserWarning（不用 ignore::UserWarning 那种粗过滤）。
# schema 作为字段名是设计冻结项：SQLContext.schema（表卡）、PendingInterrupt.schema（挂起结构化输入），
# 功能无害，逐条精确屏蔽。
#
# 注意：pytest 的 message 字段是「前缀正则」（等价 warnings.filterwarnings 的 message 参数，
# 用 re.match 从头匹配），必须与真实警告文案逐字对齐，否则过滤静默失效。
# 实测文案（pydantic 2.13.5）：
#   Field name "schema" in "SQLContext" shadows an attribute in parent "BaseModel"
#   Field name "schema" in "PendingInterrupt" shadows an attribute in parent "BaseModel"
# 若将来 pydantic 换了措辞，此条会静默失效 —— 届时该 UserWarning 会重新出现在输出里，
# 属「fail-loud」，按新文案同步这一行即可。
filterwarnings =
    ignore:Field name "schema" in "SQLContext" shadows an attribute in parent "BaseModel":UserWarning
    ignore:Field name "schema" in "PendingInterrupt" shadows an attribute in parent "BaseModel":UserWarning
